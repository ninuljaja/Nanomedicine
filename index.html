<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>AT-1 Nanomedicine</title>

		<style>
			body {
				margin: 0;
				font-family: Arial, sans-serif;
				background: #f4f6f8;
			}

			.container {
				height: 100vh;
				display: grid;
				grid-template-rows: auto auto auto 1fr;
				gap: 8px;
				padding: 8px;
				box-sizing: border-box;
			}

			.card {
				background: white;
				border-radius: 6px;
				padding: 8px;
				box-shadow: 0 1px 4px rgba(0,0,0,0.1);
				text-align: center;
				
			}

			.header {
				font-size: 28px;
				font-weight: bold;
			}

			.bios {
				display: flex;
				justify-content: center;
				gap: 40px;
			}

			.bio img {
				width: 280px;
				height: 350px;
				
				object-fit: cover;
			}

			.links {
				display: flex;
				justify-content: center;
				gap: 12px;
				flex-wrap: wrap;
			}

			a.button {
				display: inline-flex;
				padding: 8px 14px;
				align-items: center;
				justify-content: center; 
				background: #0077cc;
				color: white;
				text-decoration: none;
				border-radius: 5px;
				font-size: 13px;
				width: auto;       
				min-width: 140px;  
				text-align: center;
				
			}
			
			.video-container {
				position: relative;
				width: 250px; 
				max-width: 100%;
				margin: 0 auto;
				cursor: pointer;
			}

			.video-container img {
				width: 100%;
				border-radius: 6px;
			}

			.play-button {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-size: 40px;
				color: white;
				background: rgba(0,0,0,0.6);
				border-radius: 50%;
				padding: 10px 14px;
			}
			

		</style>
	</head>

	<body>

		<div class="container">

			<!-- HEADER -->
			<div class="card header">
				Project ID: AT-1 |
				Title: Nanomedicine
			</div>

			<!-- TEAM -->
			<div class="card bios">
				<div class="bio">
					<img src="files/Media.jfif">
					<div>Rakshak Gurung</div>
				</div>

				<div class="bio">
					<img src="files/image2.jpg">
					<div>Nino Tkabladze</div>
				</div>
			</div>

			<!-- COURSE INFO -->
			<div class="card">
				Course: AI7993<br>
				Semester: Spring 2026
			</div>

			<!-- LINKS -->
			<div class="card links">

				<a class="button" href="FinalReport.pdf" target="_blank">Final Report (PDF)</a>

				<a class="button" href="https://github.com/ninuljaja/Nanomedicine/" target="_blank">GitHub</a>
				

			</div>
			
			<div class="card">
				<div class="video-container">
					<img src="https://img.youtube.com/vi/tgbNymZ7vqY/0.jpg" alt="Video thumbnail">
					<div class="play-button">▶</div>
				</div>
			</div>



		</div>	
		<script>
			document.querySelector('.video-container').addEventListener('click', function() {
				this.innerHTML = `
					<iframe
					src="https://www.youtube.com/embed/tgbNymZ7vqY"
					frameborder="0" allowfullscreen></iframe>
				`;
			});
		</script>

			

	</body>
</html>
